<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Cantinho dos Amigos — Início</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <a class="logo" href="index.html" aria-label="Cantinho dos Amigos"><img src="logo.png" alt="Cantinho dos Amigos"></a>
  <nav><a href="index.html">Início</a><a href="#salas">Salas</a><a href="login.html">Entrar</a></nav>
</header>
<main>

    <div>

      <p class="lead">Crie uma sala, compartilhe sua câmera, microfone ou tela e converse em tempo real.</p>
      <div class="actions">

  </section>

<footer>Cantinho dos Amigos • Projeto educacional</footer>
