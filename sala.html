<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" href="favicon.png"><title>Sala — Cantinho dos Amigos</title><link rel="stylesheet" href="css/style.css"></head>
<body class="room-page">
<header class="topbar"><a class="logo" href="index.html" aria-label="Cantinho dos Amigos"><img src="logo.png" alt="Cantinho dos Amigos"></a><div class="room-title">Sala <b id="roomName">...</b></div><a href="index.html" class="btn small ghost">Sair</a></header>
<main class="room-layout">
<section class="stage"><video id="localVideo" autoplay muted playsinline></video><div id="videoPlaceholder" class="video-placeholder"><div class="camera-icon">◉</div><h2>Sua transmissão</h2><p>Ative a câmera ou compartilhe sua tela.</p></div>
<div class="controls"><button id="cameraBtn" class="control">📹 Câmera</button><button id="micBtn" class="control">🎙 Microfone</button><button id="screenBtn" class="control">🖥 Tela</button><button id="copyBtn" class="control">🔗 Copiar link</button></div></section>
<aside class="chat"><div class="chat-head"><b>Chat</b><span id="online">0 online</span></div><div id="messages" class="messages"></div><form id="chatForm" class="chat-form"><input id="messageInput" maxlength="300" placeholder="Digite uma mensagem..." autocomplete="off"><button>➤</button></form></aside>
</main><script src="js/room.js"></script></body></html>
